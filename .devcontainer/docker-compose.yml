services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      # Overrides the localhost default from .env so the app talks to the
      # PostgreSQL service below (process env wins over .env files).
      DATABASE_URL: postgresql://cloudimage:cloudimage@db:5432/cloudimage
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudimage
      POSTGRES_PASSWORD: cloudimage
      POSTGRES_DB: cloudimage
    volumes:
      - cloudimage-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cloudimage -d cloudimage']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloudimage-db-data:
